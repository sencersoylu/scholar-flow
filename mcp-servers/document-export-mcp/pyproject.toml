[project]
name = "scholar-flow-document-export-mcp"
version = "0.1.0"
description = "Manuscript export and submission packaging MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "python-docx>=1.1",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/document_export_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

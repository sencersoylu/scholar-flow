[project]
name = "scholar-flow-statistics-mcp"
version = "0.1.0"
description = "Python/R statistical analysis runtime"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "openpyxl>=3.1",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

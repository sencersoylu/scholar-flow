[project]
name = "scholar-flow-semantic-scholar-mcp"
version = "0.1.0"
description = "Semantic Scholar API for citation analysis"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_scholar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
